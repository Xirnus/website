<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel ="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-[Nunito] text-weight-normal bg-[url('imgs/flower_background.png')] bg-cover bg-center bg-fixed">
    <!-- Navbar with solid background -->
    <div class="bg-gray-800 border-b border-white">
        <nav class="w-full p-7 flex items-center justify-between">
            <!-- Left side: Navigation links -->
            <ul class="flex space-x-8">
                <li><a href="index.html" class="text-3xl font-bold text-white hover:text-gray-400 border-2 border-gray-900 rounded-xl p-2 bg-gray-900">Home</a></li>
                <li><a href="projects.html" class="text-3xl font-bold text-white hover:text-gray-400 border-2 border-gray-900 rounded-xl p-2 bg-gray-900">Projects</a></li>
                <li><a href="#" class="text-yellow-400 text-3xl font-bold text-white hover:text-gray-400 border-2 border-gray-900 rounded-xl p-2 bg-gray-900">Contacts</a></li>
                <li><a href="about.html" class="text-3xl font-bold text-white hover:text-gray-400 border-2 border-gray-900 rounded-xl p-2 bg-gray-900">About</a></li>
            </ul>
            <!-- Right side: Portfolio link with hover -->
            <a href="#" class="text-4xl text-white font-bold border-2 border-gray-900 rounded-xl p-2 bg-gray-900">Contacts</a>
        </nav>
    </div>
    <!-- Main content -->
    <div class="container mx-auto flex justify-center items-center min-h-screen">
        <div class="bg-gray-800 p-10 rounded-lg border border-yellow-400 shadow-lg max-w-4xl w-full">
            <div class="text-center">
                <h2 class="text-3xl font-bold mb-6" style="color: #E3D2C3;">Contact Me</h2>
                <div class="flex justify-center space-x-8 mb-8">
                    <!-- Facebook Link -->
                    <a href="https://www.facebook.com/Xernous" target="_blank" class="text-blue-500 hover:text-blue-400 text-2xl">
                        <img src="imgs/Facebook.svg" alt="Facebook" class="w-12 h-12 inline-block">
                    </a>
                    <!-- GitHub Link -->
                    <a href="https://github.com/Xirnus" target="_blank" class="text-gray-400 hover:text-gray-300 text-2xl">
                        <img src="imgs/Github.svg" alt="Github" class="w-12 h-12 inline-block">
                    </a>
                    <!-- Email -->
                    <a href="mailto:vercelesjames27@gmail.com" class="text-yellow-400 hover:text-yellow-300 text-2xl">
                        <img src="imgs/Gmail.svg" alt="Gmail" class="w-12 h-12 inline-block">
                    </a>
                </div>
            </div>
    
            <!-- Contact Form -->
            <div class="mt-10">
                <h2 class="text-2xl font-bold mb-4 text-center" style="color: #E3D2C3;">Send Me a Message</h2>
                <form action="https://formspree.io/f/xblogkgz" method="POST" class="space-y-4">
                    <div>
                        <label for="name" class="block text-lg font-semibold mb-2">Name</label>
                        <input type="text" id="name" name="name" class="w-full p-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
                    </div>
                    <div>
                        <label for="email" class="block text-lg font-semibold mb-2">Email</label>
                        <input type="email" id="email" name="_replyto" class="w-full p-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
                    </div>
                    <div>
                        <label for="subject" class="block text-lg font-semibold mb-2">Subject</label>
                        <input type="text" id="subject" name="subject" class="w-full p-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
                    </div>
                    <div>
                        <label for="message" class="block text-lg font-semibold mb-2">Message</label>
                        <textarea id="message" name="message" rows="5" class="w-full p-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-400" required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="px-6 py-2 bg-yellow-400 text-gray-900 font-bold rounded-lg hover:bg-yellow-300 focus:outline-none focus:ring-2 focus:ring-yellow-400">Send</button>
                    </div>
                </form>
            </div> 
        </div>
    </div>
                
    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-white p-5 text-center inset-x-0 bottom-0">
        <p class="text-white">© 2025 James Edward L. Verceles. All rights reserved.</p>
    </footer>
</body>
</html>
